<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#f3f8f1"/><rect width="1080" height="225" fill="#123c36"/><text x="70" y="78" font-family="Arial" font-size="34" fill="#a9e7a9" font-weight="bold">VADI #015 • AGRICULTURE & DATA</text><text x="70" y="150" font-family="Arial" font-size="48" fill="#ffffff" font-weight="bold">Observer avant d'ajuster</text><text x="70" y="190" font-family="Arial" font-size="24" fill="#ffffff">Le suivi quotidien améliore les décisions sous serre.</text><rect x="70" y="285" width="440" height="205" rx="24" fill="#dcefe3"/><text x="105" y="340" font-family="Arial" font-size="32" fill="#174d38" font-weight="bold">CLIMAT</text><text x="105" y="390" font-family="Arial" font-size="26" fill="#365b42">Température • humidité</text><text x="105" y="435" font-family="Arial" font-size="26" fill="#365b42">Ventilation • ombrage</text><rect x="570" y="285" width="440" height="205" rx="24" fill="#e0eaf7"/><text x="605" y="340" font-family="Arial" font-size="32" fill="#244c7c" font-weight="bold">IRRIGATION</text><text x="605" y="390" font-family="Arial" font-size="26" fill="#36516c">Volume • fréquence</text><text x="605" y="435" font-family="Arial" font-size="26" fill="#36516c">EC • pH • drainage</text><rect x="70" y="535" width="940" height="190" rx="24" fill="#fff0d6"/><text x="110" y="590" font-family="Arial" font-size="31" fill="#82551c" font-weight="bold">DONNÉES DE PRODUCTION</text><text x="110" y="640" font-family="Arial" font-size="26" fill="#6e512d">Floraison • nouaison • calibre • rendement</text><text x="110" y="685" font-family="Arial" font-size="26" fill="#6e512d">Comparer les tendances, pas une mesure isolée.</text><text x="70" y="800" font-family="Arial" font-size="31" fill="#173c36" font-weight="bold">LA BOUCLE DE PILOTAGE</text><text x="70" y="860" font-family="Arial" font-size="28" fill="#365b42">Mesurer → Analyser → Décider → Vérifier</text><text x="70" y="940" font-family="Arial" font-size="25" fill="#365b42">Un indicateur n'a de valeur que s'il aide à agir.</text><text x="70" y="1015" font-family="Arial" font-size="22" fill="#45645b">Agro-industrie Dooni • Cultiver les données, produire avec précision.</text></svg>