<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#f3f6ed"/><rect x="36" y="36" width="1008" height="1008" rx="34" fill="#fff" stroke="#d3e2ca" stroke-width="4"/><rect x="36" y="36" width="1008" height="210" rx="34" fill="#176b43"/><rect x="36" y="190" width="1008" height="56" fill="#176b43"/><text x="78" y="100" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#d8ed7d">VADI #018</text><text x="78" y="165" font-family="Arial,sans-serif" font-size="55" font-weight="700" fill="#fff">L’EAU AU BON MOMENT</text><text x="78" y="215" font-family="Arial,sans-serif" font-size="25" fill="#fff">Observer • Adapter • Mesurer</text><g transform="translate(80,290)"><path d="M145 0 C105 65 50 125 50 190 A95 95 0 0 0 240 190 C240 125 185 65 145 0Z" fill="#2d91c2"/><path d="M145 55 C125 95 92 128 92 170 A53 53 0 0 0 198 170 C198 128 165 95 145 55Z" fill="#bfeafa"/><path d="M145 100 C135 120 118 140 118 161 A27 27 0 0 0 172 161 C172 140 155 120 145 100Z" fill="#2d91c2"/></g><g font-family="Arial,sans-serif"><text x="370" y="330" font-size="32" font-weight="700" fill="#176b43">1. Observer l’humidité du sol</text><text x="370" y="375" font-size="25" fill="#27352c">Vérifier la zone racinaire régulièrement.</text><text x="370" y="414" font-size="25" fill="#27352c">Éviter un sol détrempé ou trop sec.</text><line x1="80" y1="520" x2="1000" y2="520" stroke="#d7e4d1" stroke-width="3"/><circle cx="155" cy="630" r="62" fill="#e6f2d9"/><path d="M155 675 C130 640 128 610 155 580 C182 610 180 640 155 675Z" fill="#3f9b56"/><path d="M155 670 L155 600" stroke="#176b43" stroke-width="5"/><text x="270" y="585" font-size="32" font-weight="700" fill="#176b43">2. Adapter au stade de la culture</text><text x="270" y="630" font-size="25" fill="#27352c">Les besoins changent avec la croissance,</text><text x="270" y="669" font-size="25" fill="#27352c">la floraison et le développement des fruits.</text><line x1="80" y1="730" x2="1000" y2="730" stroke="#d7e4d1" stroke-width="3"/><circle cx="155" cy="835" r="62" fill="#e0f0f8"/><path d="M110 835 L200 835 M155 790 L155 880" stroke="#2d91c2" stroke-width="9" stroke-linecap="round"/><circle cx="155" cy="835" r="24" fill="#2d91c2"/><text x="270" y="795" font-size="32" font-weight="700" fill="#176b43">3. Mesurer les volumes</text><text x="270" y="840" font-size="25" fill="#27352c">Contrôler les apports, les goutteurs</text><text x="270" y="879" font-size="25" fill="#27352c">et les fuites pour limiter le gaspillage.</text></g><rect x="65" y="935" width="950" height="70" rx="18" fill="#f0d46a"/><text x="540" y="979" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#263b29">La bonne dose, au bon moment, selon la culture.</text><text x="540" y="1030" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#526652">Agro-industrie dɔoni • Vision Agro Daily Intelligence</text></svg>