<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#f7f4e8"/><rect width="1080" height="170" fill="#07583e"/><text x="55" y="72" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#fff">VADI #019 · VISION AGRO DAILY</text><text x="55" y="128" font-family="Arial,sans-serif" font-size="25" fill="#d9efcf">SEMENCES DE QUALITÉ, MEILLEURE PRODUCTION</text><text x="55" y="250" font-family="Arial,sans-serif" font-size="51" font-weight="bold" fill="#16452e">TESTER LE POUVOIR</text><text x="55" y="310" font-family="Arial,sans-serif" font-size="51" font-weight="bold" fill="#a04b1a">GERMINATIF</text><text x="55" y="365" font-family="Arial,sans-serif" font-size="27" fill="#333">Un test simple avant de semer</text><rect x="55" y="420" width="970" height="440" rx="24" fill="#e4efdc"/><g font-family="Arial,sans-serif" fill="#17472f"><circle cx="125" cy="505" r="35" fill="#0b6848"/><text x="125" y="518" font-size="36" text-anchor="middle" fill="#fff" font-weight="bold">1</text><text x="185" y="498" font-size="29" font-weight="bold">Prélever un échantillon</text><text x="185" y="536" font-size="23">Choisir des graines représentatives du lot.</text><circle cx="125" cy="615" r="35" fill="#0b6848"/><text x="125" y="628" font-size="36" text-anchor="middle" fill="#fff" font-weight="bold">2</text><text x="185" y="608" font-size="29" font-weight="bold">Placer sur un support humide</text><text x="185" y="646" font-size="23">Humide, propre, mais sans excès d’eau.</text><circle cx="125" cy="725" r="35" fill="#0b6848"/><text x="125" y="738" font-size="36" text-anchor="middle" fill="#fff" font-weight="bold">3</text><text x="185" y="718" font-size="29" font-weight="bold">Observer dans les conditions adaptées</text><text x="185" y="756" font-size="23">Respecter la durée propre à l’espèce.</text><circle cx="125" cy="815" r="35" fill="#0b6848"/><text x="125" y="828" font-size="36" text-anchor="middle" fill="#fff" font-weight="bold">4</text><text x="185" y="808" font-size="29" font-weight="bold">Compter les plantules normales</text><text x="185" y="846" font-size="23">À la fin du test, calculer le pourcentage.</text></g><rect x="55" y="900" width="970" height="190" rx="24" fill="#fff0b8"/><text x="90" y="957" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#71401b">TAUX DE GERMINATION (%)</text><text x="90" y="1012" font-family="Arial,sans-serif" font-size="29" fill="#222">(graines germées ÷ graines testées) × 100</text><text x="90" y="1060" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#07583e">Exemple : 18 sur 20 = 90 %</text><rect x="55" y="1120" width="970" height="125" rx="24" fill="#07583e"/><text x="85" y="1172" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#fff">À RETENIR</text><text x="85" y="1215" font-family="Arial,sans-serif" font-size="24" fill="#fff">Le taux observé est un repère, pas une garantie de levée au champ.</text><text x="55" y="1300" font-family="Arial,sans-serif" font-size="23" fill="#17472f">Agro-industrie Dooni · Cultiver les données, récolter la performance.</text></svg>