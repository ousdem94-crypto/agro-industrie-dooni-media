<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<rect width="1080" height="1080" fill="#f4f7f0"/>
<rect x="55" y="55" width="970" height="970" rx="36" fill="white" stroke="#2f5d3a" stroke-width="6"/>
<text x="90" y="145" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#24482e">🌱 VADI #014</text>
<text x="90" y="210" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#17351f">L’EAU D’IRRIGATION PEUT</text>
<text x="90" y="258" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#17351f">ACCUMULER DES SELS DANS LE SOL</text>
<line x1="90" y1="300" x2="990" y2="300" stroke="#2f5d3a" stroke-width="4"/>
<text x="90" y="365" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#2f5d3a">💧 Eau → 🌱 racines → 🧂 sels → 📉 rendement</text>
<text x="90" y="425" font-family="Arial,sans-serif" font-size="27" fill="#333">Une irrigation répétée apporte aussi les sels</text>
<text x="90" y="465" font-family="Arial,sans-serif" font-size="27" fill="#333">présents dans l’eau. Sans drainage suffisant,</text>
<text x="90" y="505" font-family="Arial,sans-serif" font-size="27" fill="#333">ils peuvent s’accumuler dans la zone racinaire.</text>
<rect x="90" y="555" width="900" height="190" rx="24" fill="#eef5ea"/>
<text x="125" y="610" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#24482e">📊 À SURVEILLER</text>
<text x="125" y="660" font-family="Arial,sans-serif" font-size="25" fill="#333">• qualité de l’eau / EC</text>
<text x="420" y="660" font-family="Arial,sans-serif" font-size="25" fill="#333">• EC du drainage</text>
<text x="125" y="705" font-family="Arial,sans-serif" font-size="25" fill="#333">• volume d’irrigation</text>
<text x="420" y="705" font-family="Arial,sans-serif" font-size="25" fill="#333">• drainage</text>
<text x="90" y="810" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17351f">Bonne gestion = mesurer + irriguer + drainer + analyser</text>
<text x="90" y="875" font-family="Arial,sans-serif" font-size="25" fill="#555">Source : FAO — Water quality for agriculture / salinity management</text>
<text x="90" y="950" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#2f5d3a">Agroindustrie Dooni • Data × Agriculture</text>
</svg>