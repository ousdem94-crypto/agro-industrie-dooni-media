<text x="40" y="95" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#214f36">GRAIN</text><text x="40" y="130" font-family="Arial,sans-serif" font-size="22" fill="#214f36">suffisamment</text><text x="40" y="160" font-family="Arial,sans-serif" font-size="22" fill="#214f36">sec avant</text><text x="40" y="190" font-family="Arial,sans-serif" font-size="22" fill="#214f36">fermeture</text>
<text x="645" y="95" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#214f36">SAC</text><text x="645" y="130" font-family="Arial,sans-serif" font-size="22" fill="#214f36">intact et</text><text x="645" y="160" font-family="Arial,sans-serif" font-size="22" fill="#214f36">bien fermé</text><text x="645" y="205" font-family="Arial,sans-serif" font-size="22" fill="#214f36">à l’abri de l’eau</text>
