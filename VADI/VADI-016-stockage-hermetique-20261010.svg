<text x="92" y="102" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#d7e9a4">AGRO-INDUSTRIE DOONI • VADI #016</text>
<text x="92" y="157" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">POST-RÉCOLTE</text>
<text x="90" y="286" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#214f36">LE SAC HERMÉTIQUE</text>
<text x="90" y="340" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#214f36">PROTÈGE LE GRAIN,</text>
<text x="90" y="394" font-family="Arial,sans-serif" font-size="45" font-weight="700" fill="#a04c20">MAIS NE LE SÈCHE PAS.</text>
