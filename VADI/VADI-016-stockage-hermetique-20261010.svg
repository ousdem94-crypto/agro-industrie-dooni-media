<g font-family="Arial,sans-serif">
<rect x="90" y="742" width="900" height="118" rx="18" fill="#e4efdc"/><circle cx="145" cy="801" r="29" fill="#315c3b"/><text x="145" y="811" font-size="30" font-weight="700" text-anchor="middle" fill="#fff">1</text><text x="198" y="790" font-size="31" font-weight="700" fill="#214f36">SÉCHER</text><text x="198" y="828" font-size="23" fill="#344b38">Adapter le séchage à la céréale et aux conditions de stockage.</text>
<rect x="90" y="878" width="900" height="118" rx="18" fill="#e4efdc"/><circle cx="145" cy="937" r="29" fill="#315c3b"/><text x="145" y="947" font-size="30" font-weight="700" text-anchor="middle" fill="#fff">2</text><text x="198" y="926" font-size="31" font-weight="700" fill="#214f36">FERMER</text><text x="198" y="964" font-size="23" fill="#344b38">Utiliser un sac hermétique intact, selon les consignes du fabricant.</text>
<rect x="90" y="1014" width="900" height="118" rx="18" fill="#e4efdc"/><circle cx="145" cy="1073" r="29" fill="#315c3b"/><text x="145" y="1083" font-size="30" font-weight="700" text-anchor="middle" fill="#fff">3</text><text x="198" y="1062" font-size="31" font-weight="700" fill="#214f36">SURVEILLER</text><text x="198" y="1100" font-size="23" fill="#344b38">Noter dates, humidité mesurée, état des sacs et pertes observées.</text>
</g>
<rect x="90" y="1160" width="900" height="94" rx="18" fill="#214f36"/>
<text x="540" y="1199" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#ffffff">DES GRAINS SUFFISAMMENT SECS</text><text x="540" y="1234" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#d7e9a4">+ UN SAC INTACT + UN SUIVI RÉGULIER</text>
<text x="540" y="1280" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#4d654f">Références : FAO — séchage et conservation des céréales ; FAO AGRIS — stockage hermétique.</text>
