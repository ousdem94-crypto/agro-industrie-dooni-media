<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#f4f8f5"/><rect width="1080" height="220" fill="#123c36"/><text x="70" y="88" font-family="Arial" font-size="32" fill="#9ee6b0" font-weight="bold">PROBLÉMATIQUE MÉTIER DATA</text><text x="70" y="160" font-family="Arial" font-size="52" fill="#ffffff" font-weight="bold">Le stock est-il au bon niveau ?</text><text x="70" y="290" font-family="Arial" font-size="30" fill="#173c36" font-weight="bold">CAS PRATIQUE • SUPPLY CHAIN ANALYTICS</text><rect x="70" y="340" width="940" height="150" rx="24" fill="#ffffff" stroke="#c5ddd0" stroke-width="3"/><text x="110" y="395" font-family="Arial" font-size="28" fill="#45645b">91 250 lignes • 50 SKU • 5 entrepôts • 365 jours</text><text x="110" y="445" font-family="Arial" font-size="27" fill="#45645b">Données quotidiennes de stock, ventes et commandes</text><rect x="70" y="540" width="280" height="155" rx="20" fill="#dcefe3"/><text x="100" y="590" font-family="Arial" font-size="28" fill="#174d38" font-weight="bold">1. MESURER</text><text x="100" y="642" font-family="Arial" font-size="23" fill="#174d38">Stock & ventes</text><rect x="400" y="540" width="280" height="155" rx="20" fill="#e0eaf7"/><text x="430" y="590" font-family="Arial" font-size="28" fill="#244c7c" font-weight="bold">2. ANALYSER</text><text x="430" y="642" font-family="Arial" font-size="23" fill="#244c7c">Ruptures & excès</text><rect x="730" y="540" width="280" height="155" rx="20" fill="#fff0d6"/><text x="760" y="590" font-family="Arial" font-size="28" fill="#82551c" font-weight="bold">3. AGIR</text><text x="760" y="642" font-family="Arial" font-size="23" fill="#82551c">Réapprovisionner</text><text x="70" y="780" font-family="Arial" font-size="30" fill="#173c36" font-weight="bold">QUESTION MÉTIER</text><text x="70" y="830" font-family="Arial" font-size="27" fill="#45645b">Quels produits risquent la rupture et où agir en priorité ?</text><te