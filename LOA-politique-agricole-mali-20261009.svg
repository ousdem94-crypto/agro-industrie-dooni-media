<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#f8f6ed"/><rect width="1080" height="235" fill="#174d38"/><text x="70" y="75" font-family="Arial" font-size="30" fill="#c8efad" font-weight="bold">LOA + POLITIQUES AGRICOLES DU MALI</text><text x="70" y="145" font-family="Arial" font-size="48" fill="#fff" font-weight="bold">De la loi à l'action</text><text x="70" y="195" font-family="Arial" font-size="25" fill="#fff">Comment structurer le développement agricole ?</text><rect x="70" y="285" width="940" height="135" rx="22" fill="#e1eed9"/><text x="110" y="335" font-family="Arial" font-size="30" fill="#174d38" font-weight="bold">LOA — Loi d'Orientation Agricole</text><text x="110" y="380" font-family="Arial" font-size="25" fill="#365b42">Le cadre d'orientation du secteur agricole.</text><path d="M540 420 V475" stroke="#6b8c5d" stroke-width="7"/><path d="M530 460 L540 478 L550 460" fill="none" stroke="#6b8c5d" stroke-width="7"/><rect x="70" y="490" width="940" height="135" rx="22" fill="#e3ebf7"/><text x="110" y="540" font-family="Arial" font-size="30" fill="#244c7c" font-weight="bold">PDA — Politique de Développement Agricole</text><text x="110" y="585" font-family="Arial" font-size="25" fill="#36516c">Des orientations communes pour les programmes.</text><text x="70" y="690" font-family="Arial" font-size="30" fill="#174d38" font-weight="bold">PRIORITÉS À RELIER SUR LE TERRAIN</text><g font-family="Arial" font-size="24" fill="#30463a"><text x="95" y="750">✓ Sécurité et souveraineté alimentaires</text><text x="95" y="800">✓ Gestion durable des ressources naturelles</text><text x="95" y="850">✓ Modernisation et compétitivité des filières</text><text x="95" y="900">✓ Recherche, innovation et formation</text><text x="95" y="950">✓ Réduction de la pauvreté rurale</text></g><text x="70" y="1015" font-family="Arial" font-size="22" fill="#365b42">Traduire les orientations en services, financement et résultats mesurables.</text></svg>