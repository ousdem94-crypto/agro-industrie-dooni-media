name: Convert NAA 002 infographic to PNG
on:
  push:
    branches: [main]
    paths:
      - 'NAA/NAA-002-rumination.svg'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SVG to PNG
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="NAA/NAA-002-rumination.svg", write_to="NAA/NAA-002-rumination.png", output_width=1080, output_height=1350)
          PY
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NAA/NAA-002-rumination.png
          git commit -m "Add PNG version of NAA 002 infographic"
          git push
